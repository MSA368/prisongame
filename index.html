<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Pako Vankilasta</title>
    <style>
        body { background-color: #222; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        #box { max-width: 600px; margin: 0 auto; background: #333; padding: 20px; border-radius: 10px; border: 2px solid #ff4444; }
        .stats { background: #111; padding: 10px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        button { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #555; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #ff4444; }
    </style>
</head>
<body>

<div id="box">
    <h1>PAKO VANKILASTA</h1>
    <div class="stats">
        <div>Sijainti: <span id="loc">Selli</span></div>
        <div>Tavarat: <span id="inv">Ei mitään</span></div>
    </div>
    <p id="teksti">Ladataan peliä...</p>
    <div id="napit"></div>
</div>

<script>
// Pelitilanne
let reppu = [];
let kaivettu = 0;
let vartijaHamatty = false;
let ilmastointiAuki = false;

function paivita(teksti, valinnat) {
    document.getElementById("teksti").innerHTML = teksti;
    document.getElementById("inv").innerText = reppu.length > 0 ? reppu.join(", ") : "Tyhjä";
    
    let nappiAlue = document.getElementById("napit");
    nappiAlue.innerHTML = "";
    
    valinnat.forEach(v => {
        let b = document.createElement("button");
        b.innerText = v.t;
        b.onclick = v.f;
        nappiAlue.appendChild(b);
    });
}

function meneSelli() {
    document.getElementById("loc").innerText = "Oma Selli";
    let teksti = "Olet suljettuna selliin. Seinä on murenevaa tiiltä. Käytävästä kuuluu askeleita.";
    let valinnat = [
        { t: "Etsi sängyn alta", f: () => {
            if(!reppu.includes("Ruuvimeisseli")) {
                reppu.push("Ruuvimeisseli");
                paivita("Löysit vanhan ruuvimeisselin!", [{t: "Jatka", f: meneSelli}]);
            } else {
                paivita("Sängyn alla on vain pölyä.", [{t: "Jatka", f: meneSelli}]);
            }
        }},
        { t: "Kaiva takaseinää", f: () => {
            if(reppu.includes("Ruuvimeisseli")) {
                kaivettu += 25;
                if(kaivettu >= 100) {
                    paivita("Sait tehtyä seinään ison reiän!", [{t: "Mene reiästä sisään", f: meneSalakaytava}]);
                } else {
                    paivita(`Raaputat seinää. Se murenee vähän. (Edistyminen: ${kaivettu}%)`, [{t: "Jatka kaivamista", f: meneSelli}]);
                }
            } else {
                paivita("Seinä on liian kova kynsille. Tarvitset työkalun.", [{t: "Palaa", f: meneSelli}]);
            }
        }},
        { t: "Astu ulos käytävälle", f: meneKaytava }
    ];
    if(kaivettu >= 100) {
        valinnat.push({ t: "Mene seinän reiästä salakäytävään", f: meneSalakaytava });
    }
    paivita(teksti, valinnat);
}

function meneKaytava() {
    document.getElementById("loc").innerText = "Pääkäytävä";
    let teksti = "Pitkä käytävä. Pohjoisessa häämöttää ulko-ovi ja vartijoiden koppi. Etelässä on piha, lännessä ruokala.";
    paivita(teksti, [
        { t: "Mene Ruokalaan", f: meneRuokala },
        { t: "Mene Ulkoilupihalle", f: menePiha },
        { t: "Yritä juosta ulko-ovesta karkuun", f: () => {
            if(vartijaHamatty && reppu.includes("Avainkortti")) {
                meneVoitto();
            } else if(reppu.includes("Avainkortti")) {
                paivita("Vartija näkee sinut ja ottaa kiinni! Tarvitset hämäyksen.", [{t: "Palaa käytävälle", f: meneKaytava}]);
            } else {
                paivita("Ovi on lukossa sähköisellä kortilla, ja vartija tuijottaa sinua.", [{t: "Palaa", f: meneKaytava}]);
            }
        }},
        { t: "Palaa omaan selliin", f: meneSelli }
    ]);
}

function meneRuokala() {
    document.getElementById("loc").innerText = "Ruokala";
    paivita("Ruokalassa on kova meteli. Lattialla lojuu kiiltävä kolikko.", [
        { t: "Poimi kolikko", f: () => {
            if(!reppu.includes("Kolikko")) {
                reppu.push("Kolikko");
                paivita("Poimit kolikon taskuun.", [{t: "Jatka", f: meneRuokala}]);
            } else {
                paivita("Lattia on tyhjä.", [{t: "Jatka", f: meneRuokala}]);
            }
        }},
        { t: "Osta keittiöläiseltä sytytin", f: () => {
            if(reppu.includes("Kolikko")) {
                reppu = reppu.filter(t => t !== "Kolikko");
                reppu.push("Sytytin");
                paivita("Kokki otti kolikon ja antoi sinulle sytyttimen!", [{t: "Jatka", f: meneRuokala}]);
            } else if(reppu.includes("Sytytin")) {
                paivita("Sinulla on jo sytytin.", [{t: "Jatka", f: meneRuokala}]);
            } else {
                paivita("Kokki kuiskaa: 'Anna kolikko, niin saat sytyttimen.'", [{t: "Palaa", f: meneRuokala}]);
            }
        }},
        { t: "Palaa käytävälle", f: meneKaytava }
    ]);
}

function menePiha() {
    document.getElementById("loc").innerText = "Ulkoilupiha";
    let teksti = "Ilma on kylmä. Kulmassa seisoo Iso Bob. Maassa näkyy ilmanvaihtoritilä.";
    let valinnat = [
        { t: "Puhu Isolle Bobille", f: () => {
            if(reppu.includes("Sytytin")) {
                reppu = reppu.filter(t => t !== "Sytytin");
                vartijaHamatty = true;
                paivita("Annoit sytyttimen Bobille! Hän lupaa aloittaa tappelun käytävällä hämätäkseen vartijaa.", [{t: "Mahtavaa", f: menePiha}]);
            } else if(vartijaHamatty) {
                paivita("Bob valmistautuu tappeluun käytävällä.", [{t: "Jatka", f: menePiha}]);
            } else {
                paivita("Bob sanoo: 'Etsin sytytintä. Hanki minulle sellainen, niin hämään vartijoita.'", [{t: "Selvä", f: menePiha}]);
            }
        }},
        { t: "Tutki ilmanvaihtoritilää", f: () => {
            if(reppu.includes("Ruuvimeisseli")) {
                ilmastointiAuki = true;
                paivita("Avasit ritilän ruuvimeisselillä! Täältä pääsee putkeen.", [{t: "Jatka", f: menePiha}]);
            } else {
                paivita("Ritilä on tiukasti kiinni ruuveilla. Tarvitset työkalun.", [{t: "Palaa", f: menePiha}]);
            }
        }},
        { t: "Palaa takaisin käytävälle", f: meneKaytava }
    ];
    if(ilmastointiAuki) {
        valinnat.push({ t: "Ryömi ilmanvaihtoputkeen", f: meneIlmastointi });
    }
    paivita(teksti, valinnat);
}

function meneSalakaytava() {
    document.getElementById("loc").innerText = "Huoltokäytävä";
    paivita("Olet seinän sisällä huoltokäytävässä. Pienen raon kautta näet vartijan pöydän, jossa lojuu avainkortti.", [
        { t: "Ongi avainkortti raosta ruuvimeisselillä", f: () => {
            if(!reppu.includes("Avainkortti")) {
                reppu.push("Avainkortti");
                paivita("Onnistuit! Kortti on nyt sinulla.", [{t: "Hienoa", f: meneSalakaytava}]);
            } else {
                paivita("Pöytä on tyhjä.", [{t: "Palaa", f: meneSalakaytava}]);
            }
        }},
        { t: "Palaa takaisin selliin", f: meneSelli }
    ]);
}

function meneIlmastointi() {
    document.getElementById("loc").innerText = "Ilmanvaihtoputki";
    paivita("Putki haarautuu kahteen suuntaan. Oikealta kuuluu vaarallisen kova tuulettimen ääni. Vasemmalta näkyy valoa.", [
        { t: "Mene vasemmalle kohti valoa", f: meneVoitto },
        { t: "Mene oikealle tuuletinta kohti", f: () => {
            paivita("Tuuletin pyörii liian lujaa, et pääse tästä ohi.", [{t: "Palaa", f: meneIlmastointi}]);
        }},
        { t: "Peruuta takaisin pihalle", f: menePiha }
    ]);
}

function meneVoitto() {
    document.getElementById("loc").innerText = "VAPAUS!";
    paivita("ONNEKSI OLKOON! Pääsit vankilasta vapauteen ja voitit pelin!", [
        { t: "Pelaa uudelleen", f: () => {
            reppu = []; kaivettu = 0; vartijaHamatty = false; ilmastointiAuki = false; meneSelli();
        }}
    ]);
}

// Käynnistä peli
meneSelli();
</script>

</body>
</html>

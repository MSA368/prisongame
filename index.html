<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiven sisässä - Vankilapako</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        #game-container {
            max-width: 650px;
            width: 100%;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 {
            color: #ff4444;
            text-align: center;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        #status-bar {
            display: flex;
            justify-content: space-between;
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #ff4444;
        }
        #text-box {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 120px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 12px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        button:hover {
            background-color: #ff4444;
            color: #000;
            border-color: #ff4444;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Kiven Sisässä</h1>
    
    <div id="status-bar">
        <div><strong>Sijainti:</strong> <span id="location">Selliosasto</span></div>
        <div><strong>Tavarat:</strong> <span id="inventory">Ei mitään</span></div>
    </div>

    <div id="text-box">Peli ladataan...</div>
    <div class="btn-container" id="choices-container"></div>
</div>

<script>
    // Pelitilanne
    let state = {
        inventory: [],
        guardDistracted: false,
        ventOpen: false,
        keycardStolen: false,
        moneyTaken: false
    };

    const textBox = document.getElementById('text-box');
    const choicesContainer = document.getElementById('choices-container');
    const locationDisplay = document.getElementById('location');
    const inventoryDisplay = document.getElementById('inventory');

    // Tarinasolmut
    const storyNodes = {
        alku: {
            text: "Istut synkässä sellissä Turun tiilenpäätä lukemassa. Tuomio on elinkautinen, mutta sinulla ei ole aikeita jäädä tänne. Sellikaverisi Keijo nukkuu yläpedillä. Sellin ovi on lukossa. Seinässä on vanha ilmastointiritilä, ja pöydällä on puolikas kylmä kahvi.",
            location: "Selli 4",
            choices: [
                { text: "Tutki ilmastointiritilää", nextNode: 'ritila' },
                { text: "Herätä Keijo ja pyydä apua", nextNode: 'keijo' },
                { text: "Kurkista ovesta käytävälle", nextNode: 'kaytava_kurkistus' }
            ]
        },
        ritila: {
            text: "Ilmastointiritilä on ruostunut, mutta se on tiukasti kiinni ruuveilla. Tarvitset jonkinlaisen työkalun – kuten ruuvimeisselin tai kolikon – avataksesi sen.",
            location: "Selli 4",
            choices: [
                { text: "Palaa takaisin", nextNode: 'alku' },
                { text: "Taskujen tarkistus (Etsi jotain millä avata se)", nextNode: 'taskut' }
            ]
        },
        taskut: {
            text: "Kaivelet kuluneita vankilahousujasi. Löydät taskun pohjalta vanhan 50-pennisen kolikon! Se saattaisi sopia ruuvien kantaan.",
            location: "Selli 4",
            action: () => { state.inventory.push("Kolikko"); },
            choices: [
                { text: "Kokeile kolikkoa ritilään", nextNode: 'avaa_ritila', condition: () => state.inventory.includes("Kolikko") },
                { text: "Palaa takaisin", nextNode: 'alku' }
            ]
        },
        avaa_ritila: {
            text: "Käytät kolikkoa ruuvien vääntämiseen. Ne rouskahtavat auki! Ritilä irtoaa ja alta paljastuu pimeä, pölyinen kuilu. Kuilu näyttää johtavan vankilan katolle tai huoltotiloihin.",
            location: "Selli 4",
            action: () => { state.ventOpen = true; },
            choices: [
                { text: "Kömmi sisään ilmastointikuiluun", nextNode: 'kuilu' },
                { text: "Jätä se auki ja tutki ensin muuta", nextNode: 'alku' }
            ]
        },
        keijo: {
            text: "Keijo herää murahtaen. 'Mitä helvettiä sä herätät mut vapaapäivänä?' kerrot hänelle pakosuunnitelmastasi. Keijo katsoo sinua pitkään ja sanoo: 'Mulla on varastossa sorkkarauta verstaalla, mutta vartija Korhonen vahtii sitä aluetta. Jos järjestät häiriön ruokalassa, mä voin hakea sen sulle.'",
            location: "Selli 4",
            choices: [
                { text: "Lupaa järjestää häiriö ruokalassa myöhemmin", nextNode: 'alku' }
            ]
        },
        kaytava_kurkistus: {
            text: "Katsot pienen kalteri-ikkunan läpi. Vartija istuu pöytänsä ääressä käytävän päässä lukemassa lehteä. Hänen vyöllään kimaltaa sähköinen avainkortti. Käytävän ovi ruokalaan on auki, sillä kohta on päivällisaika.",
            location: "Selliosasto",
            choices: [
                { text: "Astu käytävälle (Vartijat päästävät ruoka-aikaan)", nextNode: 'ruokala_reitti' },
                { text: "Palaa selliin", nextNode: 'alku' }
            ]
        },
        ruokala_reitti: {
            text: "Kävelet muiden vankien mukana ruokalaan. Ilmapiiri on jännittynyt. Nurkassa istuu jengi-pomo 'Leka'. Keijo iskee sinulle silmää toisesta pöydästä. Muistat Keijon pyynnön häiriöstä.",
            location: "Ruokala",
            choices: [
                { text: "Kaada Lekan keitot hänen syliinsä (Järjestä häiriö)", nextNode: 'tappelu' },
                { text: "Varasta keittiöstä veitsi vaivihkaa", nextNode: 'veitsi_varastus' },
                { text: "Palaa takaisin selliosastolle", nextNode: 'alku' }
            ]
        },
        tappelu: {
            text: "Kaadat hernesopat Lekan syliin. Leka karjuu ja nousee pystyyn, nyrkit pystyssä. Koko ruokala räjähtää huutoon ja vankilavartijat – mukaan lukien oman osastosi vartija – juoksevat paikalle rauhoittamaan tilannetta. Syntyy täysi kaaos!",
            location: "Ruokala (Kaaos)",
            action: () => { state.guardDistracted = true; },
            choices: [
                { text: "Käytä kaaos hyväksesi ja hiivi vartijan tyhjään valvomoon", nextNode: 'valvomo' },
                { text: "Juokse takaisin selliisi piiloon", nextNode: 'selli_tappelun_jälkeen' }
            ]
        },
        veitsi_varastus: {
            text: "Hiivit tiskin taakse kun kokki katsoo muualle. Nappaat terävän fileerausveitsen!",
            location: "Ruokala",
            action: () => { if(!state.inventory.includes("Veitsi")) state.inventory.push("Veitsi"); },
            choices: [
                { text: "Palaa pöytään veitsi piilotettuna", nextNode: 'ruokala_reitti' }
            ]
        },
        selli_tappelun_jälkeen: {
            text: "Livahtaisit takaisin selliisi. Hetken päästä Keijo sujahtaa sisään hengästymättömänä ja sujauttaa sinulle sorkkaraudan! 'Tässä, käytä tätä viisaasti', hän kuiskaa ennen kuin vartijat sulkevat ovet.",
            location: "Selli 4",
            action: () => { if(!state.inventory.includes("Sorkkarauta")) state.inventory.push("Sorkkarauta"); },
            choices: [
                { text: "Tutki mihin voisit käyttää sorkkarautaa sellissä", nextNode: 'ritila' },
                { text: "Odota yön selkää", nextNode: 'yo_pako' }
            ]
        },
        valvomo: {
            text: "Valvomo on tyhjä, koska kaikki juoksivat ruokalaan. Pöydällä on pääavainkortti ja kaapissa on vankilan piirustukset sekä takavarikoidut käteisvarat.",
            location: "Vartijoiden valvomo",
            choices: [
                { text: "Ota avainkortti", nextNode: 'valvomo_otettu', action: () => { state.keycardStolen = true; if(!state.inventory.includes("Avainkortti")) state.inventory.push("Avainkortti"); } },
                { text: "Ota rahat (500€ vankilan kassasta)", nextNode: 'valvomo_rahat', action: () => { state.moneyTaken = true; if(!state.inventory.includes("Rahat")) state.inventory.push("Rahat"); } },
                { text: "Pakene takaovesta vankilan pihalle", nextNode: 'piha_avainkortilla', condition: () => state.keycardStolen }
            ]
        },
        valvomo_otettu: {
            text: "Sujautat sähköisen avainkortin taskuusi. Tällä pääsee lähes jokaisesta ovesta läpi.",
            location: "Vartijoiden valvomo",
            choices: [
                { text: "Ota vielä rahat", nextNode: 'valvomo_rahat', action: () => { state.moneyTaken = true; if(!state.inventory.includes("Rahat")) state.inventory.push("Rahat"); }, condition: () => !state.moneyTaken },
                { text: "Pakene takaovesta vankilan pihalle", nextNode: 'piha_avainkortilla' }
            ]
        },
        valvomo_rahat: {
            text: "Otat rahat. Niistä on varmasti hyötyä muurien ulkopuolella lahjontaan tai pakomatkaan.",
            location: "Vartijoiden valvomo",
            choices: [

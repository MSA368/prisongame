<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pako Vankilasta - Selviytymispeli</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        #game-container {
            max-width: 800px;
            width: 100%;
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ff4444;
            text-align: center;
            border-bottom: 2px solid #ff4444;
            padding-bottom: 10px;
        }
        #status-bar {
            display: flex;
            justify-content: space-between;
            background-color: #1f1f1f;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        #story-text {
            min-height: 150px;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        #choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 12px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 4px;
            text-align: left;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #555;
            border-color: #ff4444;
        }
        .item-list {
            color: #ffbb00;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>PAKO VANKILASTA</h1>
    
    <div id="status-bar">
        <div>Sijainti: <span id="location">Selliosasto</span></div>
        <div>Tavarat: <span id="inventory" class="item-list">Tyhjä</span></div>
    </div>

    <div id="story-text">Peli latautuu...</div>
    <div id="choices"></div>
</div>

<script>
// Pelitilanne (State)
let state = {
    inventory: [],
    guardDistracted: false,
    ventOpen: false,
    keycardStolen: false,
    digProgress: 0,
    wallWeakened: false,
    money: 0
};

// Peliskenariot ja huoneet
const rooms = {
    selli: {
        title: "Oma Selli",
        text: "Istut pimeässä sellissäsi. Seinät ovat murenevaa betonia. Nurkassa on vanha sänky ja ruosteinen WC-pönttö. Käytävältä kuuluu vartijan askelia.",
        choices: [
            { text: "Tutki sängyn alusta", action: () => {
                if (!state.inventory.includes("Ruuvimeisseli")) {
                    addItem("Ruuvimeisseli");
                    return "Löysit sängyn alta vanhan, ruosteisen ruuvimeisselin!";
                }
                return "Sängyn alla on vain pölyä.";
            }},
            { text: "Tutki takaseinän betonia", action: () => {
                if (state.inventory.includes("Ruuvimeisseli")) {
                    state.digProgress += 25;
                    if (state.digProgress >= 100) {
                        state.wallWeakened = true;
                        return "Sait koverrettua seinään suuren reiän! Reikä johtaa huoltokäytävään.";
                    }
                    return `Raaputat seinää ruuvimeisselillä. Tiili murenee hieman. (Edistyminen: ${state.digProgress}%)`;
                }
                return "Seinä on liian kova paljain käsin murrettavaksi. Tarvitset työkalun.";
            }},
            { text: "Mene seinäreiän läpi huoltokäytävään", condition: () => state.wallWeakened, move: "huoltokaytava" },
            { text: "Astu ulos käytävälle (ovet ovat auki vapaatunnilla)", move: "kaytava" }
        ]
    },
    kaytava: {
        title: "Vankilan Pääkäytävä",
        text: "Pitkä, kolkko käytävä. Pohjoisessa näkyy ulko-ovi ja vartijoiden koppi. Etelässä on ulkoilupiha. Lännessä on ruokala.",
        choices: [
            { text: "Mene Ruokalaan", move: "ruokala" },
            { text: "Mene Ulkoilupihalle", move: "piha" },
            { text: "Yritä juosta suoraan ulko-ovesta ulos", action: () => {
                if (state.guardDistracted && state.inventory.includes("Avainkortti")) {
                    moveRoom("vapaus");
                    return "Vartija on kiireinen ja sinulla on kortti! Juokset ovesta ulos!";
                } else if (state.inventory.includes("Avainkortti")) {
                    return "Vartija kopissa näkee sinut heti kun lähestyt ovea ja käskee sinut takaisin. Tarvitset hämäyksen.";
                }
                return "Ovi on sähköisessä lukossa. Tarvitset avainkortin ja tavan ohittaa vartija.";
            }},
            { text: "Palaa omaan selliin", move: "selli" }
        ]
    },
    ruokala: {
        title: "Vankilan Ruokala",
        text: "Ruokala on täynnä melua. Nurkassa on keittiö. Huomaat pöydällä hylätyn tarjottimen ja maassa jotain kiiltävää.",
        choices: [
            { text: "Poimi maassa oleva kolikko", action: () => {
                if (state.money === 0) {
                    state.money = 5;
                    addItem("5 Kolikkoa");
                    return "Löysit 5 kolikkoa maasta.";
                }
                return "Maassa ei ole enää mitään.";
            }},
            { text: "Juttele keittiöläiselle", action: () => {
                if (state.money >= 5 && !state.inventory.includes("Sytytin")) {
                    state.inventory = state.inventory.filter(i => i !== "5 Kolikkoa");
                    addItem("Sytytin");
                    return "Kokki ottaa kolikkosi salaa ja sujauttaa sinulle sytyttimen.";
                }
                return "Kokki kuiskaa: 'Voin antaa sinulle jotain hyödyllistä viidellä kolikolla.'";
            }},
            { text: "Palaa käytävälle", move: "kaytava" }
        ]
    },
    piha: {
        title: "Ulkoilupiha",
        text: "Korkeat piikkilanka-aidat ympäröivät pihaa. Muutama muu vanki treenaa nurkassa. Nurmikolla näkyy vanha ilmanvaihtokanavan ritilä.",
        choices: [
            { text: "Juttele Isolle Bobille nurkassa", action: () => {
                if (state.inventory.includes("Sytytin")) {
                    state.guardDistracted = true;
                    return "Annat sytyttimen Bobille. Vastineeksi hän lupaa aloittaa tappelun käytävällä 5 minuutin kuluttua hämätäkseen vartijoita!";
                }
                return "Iso Bob sanoo: 'Etsin sytytintä. Tuo minulle sellainen, niin voin järjestää sinulle pienen hämäyksen käytävälle.'";
            }},
            { text: "Tutki ilmanvaihtoritilää", action: () => {
                if (state.inventory.includes("Ruuvimeisseli")) {
                    state.ventOpen = true;
                    return "Avasit ritilän ruuvimeisselillä! Tästä mahtuu ryömimään sisään.";
                }
                return "Ritilä on tiukasti kiinni ruuveilla. Tarvitset jotain millä avata ne.";
            }},
            { text: "Ryömi ilmanvaihtokanavaan", condition: () => state.ventOpen, move: "ilmastointi" },
            { text: "Palaa sisälle käytävälle", move: "kaytava" }
        ]
    },
    huoltokaytava: {
        title: "Salainen Huoltokäytävä",
        text: "Pimeä ja pölyinen putkistoja täynnä oleva käytävä. Täältä näkee suoraan vartijoiden päämajan takahuoneeseen pienen raon kautta.",
        choices: [
            { text: "Kurkista raosta vartijakoppiin", action: () => {
                if (!state.keycardStolen) {
                    addItem("Avainkortti");
                    state.keycardStolen = true;
                    return "Yletät pitkällä tikulla/käpälällä raosta ja onnistut onkimaan pöydälle jätetyn Avainkortin!";
                }
                return "Koppi on tyhjä esineistä.";
            }},
            { text: "Palaa takaisin selliisi", move: "selli" }
        ]
    },
    ilmastointi: {
        title: "Ilmanvaihtokanavat",
        text: "Ryömit ahtaassa metalliputkessa. Kanava haarautuu kahteen suuntaan. Oikealta kuuluu tuulettimen ääni, vasemmalta kuuluu hiljaisuutta.",
        choices: [
            { text: "Mene vasemmalle (kohti hiljaisuutta)", action: () => {
                moveRoom("vapaus");
                return "Ryömit putken päähän, potkaiset ulkoritilän irti ja tipahdat vankilan ulkopuolelle metsään!";
            }},
            { text: "Mene oikealle (kohti tuuletinta)", action: () => {
                return "Tuulettimen suuret lavat pyörivät liian lujaa. Et pääse tästä suunnasta eteenpäin ilman että loukkaannut.";
            }},
            { text: "Palaa takaisin ulkoilupihalle", move: "piha" }
        ]
    },
    vapaus: {
        title: "VAPAUS!",
        text: "Olet onnistunut! Hengität raikasta ulkoilmaa vankilan muurien ulkopuolella. Juokset kohti vapautta ja peli päättyy voittoosi!",
        choices: [
            { text: "Pelaa uudelleen", action: () => {
                resetGame();
                return "Peli aloitettu alusta.";
            }}
        ]
    }
};

let currentRoom = "selli";

function updateScreen(extraText = "") {
    const room = rooms[currentRoom];
    document.getElementById("location").innerText = room.title;
    
    // Päivitä tavaralista
    if (state.inventory.length === 0) {
        document.getElementById("inventory").innerText = "Tyhjä";
    } else {
        document.getElementById("inventory").innerText = state.inventory.join(", ");
    }

    // Päivitä tarinateksti
    let textHTML = room.text;
    if (extraText) {
        textHTML = `<strong>${extraText}</strong><br><br>` + textHTML;
    }
    document.getElementById("story-text").innerHTML = textHTML;

    // Päivitä valinnat/napit
    const choicesDiv = document.getElementById("choices");
    choicesDiv.innerHTML = "";
